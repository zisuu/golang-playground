---
name: pr-build-and-test
permissions:
  contents: read
on:
  pull_request:
    branches: ["main"]
jobs:
  pr-build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        modules:
          - hello-world
          - integers
          - iteration
          - sum
          - shapes
          - wallet
          - ./
          - di
          - countdown
          - concurrency
          - reflection
          - sync
          - context
          - numeral
          - blogposts
          - blogrenderer
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c  # v6.1.0
        with:
          cache: 'false'
          go-version: '1.25.4'
      - run: go build -v .
        working-directory: ${{matrix.modules}}
      - run: go test -v .
        working-directory: ${{matrix.modules}}
