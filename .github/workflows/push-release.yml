---
name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e  # v2.0.6
        id: app_token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          cache: 'false'
          go-version: '1.24.3'

      - name: Validate Go module
        run: |
          cd blogposts
          go mod tidy
          go mod verify

      - name: Build Binaries for All Platforms
        run: |
          platforms=("linux/amd64" "windows/amd64" "darwin/amd64")
          for platform in "${platforms[@]}"; do
            os=$(echo $platform | cut -d'/' -f1)
            arch=$(echo $platform | cut -d'/' -f2)
            output="release/blogposts-$os-$arch"
            if [ "$os" == "windows" ]; then
              output+=".exe"
            fi
            GOOS=$os GOARCH=$arch go build -o $output blogposts/cmd/main.go
          done

      - name: Configure Release Please for Multi-Platform Binary Upload
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445  # v4.2.0
        with:
          release-type: go
          extra-files: |
            release/blogposts-linux-amd64
            release/blogposts-windows-amd64.exe
            release/blogposts-darwin-amd64
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
