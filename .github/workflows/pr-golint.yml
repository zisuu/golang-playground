---
name: Golanglint
permissions:
  contents: read
on:
  pull_request:
jobs:
  Golanglint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        modules:
          - hello-world
          - integers
          - iteration
          - sum
          - shapes
          - wallet
          - ./
          - di
          - countdown
          - concurrency
          - reflection
          - sync
          - context
          - numeral
          - blogposts
          - blogrenderer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
      - uses: reviewdog/action-golangci-lint@f9bba13753278f6a73b27a56a3ffb1bfda90ed71 # v2.8.0
        with:
          level: all
          filter_mode: nofilter
          workdir: ./${{matrix.modules}}
