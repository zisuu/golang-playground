before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
#    binary: github-actions-digest-pinner
#    main: ./cmd/main.go
    binary: racer
    main: ./racer/racer.go

archives:
  - format: binary
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    replacements:
      darwin: macos
      windows: windows
      linux: linux
      amd64: x86_64
      arm64: arm64

checksum:
  name_template: 'checksums.txt'

release:
  draft: false
  prerelease: false